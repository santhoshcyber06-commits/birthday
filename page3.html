
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 Wishes For You ❤️</title>
    <link rel="stylesheet" href="page3.css">
</head>
<body>

    <div id="stars"></div>
    <div id="balloons"></div>

    <main class="page-container">

        <header>
            <p class="top-label">A LITTLE MAGIC FOR YOU</p>
            <h1>20 Little Wishes <span>✨</span></h1>
            <p class="subtitle">
                Light each candle and unlock a special wish.
            </p>
        </header>

        <section class="progress-section">
            <p id="progressText">0 / 20 Wishes Unlocked</p>

            <div class="progress-track">
                <div id="progressBar"></div>
            </div>
        </section>

        <section id="candlesGrid" class="candles-grid"></section>

        <section id="completion" class="completion">
            <h2>All 20 Wishes Are Yours! 💗</h2>

            <p>
                May every little wish turn into a beautiful memory.
                You deserve all the happiness in the world.
            </p>

            <button id="letterButton">
                MY LETTER IS WAITING 💌
            </button>
        </section>

    </main>

    <script src="page3.js"></script>
</body>
</html>
